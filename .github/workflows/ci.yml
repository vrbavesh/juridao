name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node reference/juridao-engine.test.js
      - run: node scripts/flow.mjs
      - run: node scripts/check-contract.mjs
      - run: node scripts/check-format.mjs
      - run: npm run build
