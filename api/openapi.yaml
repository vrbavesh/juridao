openapi: 3.1.0
info:
  title: JuriDAO mock-ipfs
  version: 1.0.0
  description: >
    Content-addressed evidence storage for the JuriDAO demo. Stores raw bytes
    keyed by SHA-256; identical uploads are idempotent. Canonical contract for
    boundary B2 (web/src/lib/storage.ts <-> mock-ipfs/server.js).
servers:
  - url: http://localhost:5001
paths:
  /upload:
    post:
      operationId: uploadFile
      summary: Store raw bytes, return content-addressed URI
      parameters:
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Original filename; hints Content-Type on later GET.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored (or already present - idempotent by content hash)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResponse" }
        "400":
          description: Empty body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ipfs/{hash}:
    get:
      operationId: fetchFile
      summary: Fetch stored bytes by content hash
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: "^mock-[a-f0-9]{64}$" }
          description: "<sha256> in the form mock-<sha256> as returned in UploadResponse.uri"
      responses:
        "200":
          description: Raw bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Unknown hash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  schemas:
    UploadResponse:
      type: object
      required: [uri, hash]
      additionalProperties: false
      properties:
        uri:
          type: string
          pattern: "^ipfs://mock-[a-f0-9]{64}$"
        hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Bare SHA-256 hex of the body.
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string }
            message: { type: string }
